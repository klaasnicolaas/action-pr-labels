---
name: Update distribution

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-distribution
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  DIST_BRANCH: chore/update-dist

jobs:
  update:
    name: 📦 Update distribution bundle
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci --ignore-scripts
      - name: 🚀 Run tests
        run: npm test
      - name: 🔍 Check formatting
        run: npm run format:check
      - name: 🔍 Check types
        run: npm run typing:check
      - name: 📦 Build distribution bundle
        run: npm run build
      - name: Create or update distribution pull request
        id: dist-pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add --all -- dist/

          if git diff --cached --quiet; then
            echo "The committed distribution bundle is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed distribution bundle is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          remote_sha="$(git ls-remote origin "refs/heads/$DIST_BRANCH" | cut -f1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$DIST_BRANCH"
          git commit --message "chore: update distribution bundle"

          push_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$DIST_BRANCH:$remote_sha" \
              "$push_url" "HEAD:refs/heads/$DIST_BRANCH"
          else
            git push "$push_url" "HEAD:refs/heads/$DIST_BRANCH"
          fi

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$DIST_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$DIST_BRANCH" \
              --title "chore: update distribution bundle" \
              --label maintenance \
              --body "Keep the committed distribution bundle in sync with the current default branch. This pull request is updated automatically and can be merged when preparing a release.")"
            pr_number="${pr_url##*/}"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Updated distribution bundle in PR #$pr_number." >> "$GITHUB_STEP_SUMMARY"
      - name: Start pull request checks
        if: steps.dist-pr.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.dist-pr.outputs.pr-number }}
        run: |
          gh workflow run tests.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DIST_BRANCH"
          gh workflow run linting.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DIST_BRANCH"
          gh workflow run typing.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DIST_BRANCH"
          gh workflow run pr-labels.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DIST_BRANCH" \
            --field pr_number="$PR_NUMBER"
